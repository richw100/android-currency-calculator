name: CalcApp
options:
  bundleIdPrefix: com.richw
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: "YES"

targets:
  CalcApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CalcApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richw.calcapp
        INFOPLIST_FILE: CalcApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: "NO"
        Release:
          CODE_SIGNING_ALLOWED: "YES"
