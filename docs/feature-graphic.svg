<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a2f3f"/>
    </linearGradient>
    <!-- Teal glow for accent circle -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BCD4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="roundedClip">
      <rect width="1024" height="500" rx="0" ry="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#grid)"/>

  <!-- Decorative glow circles -->
  <circle cx="820" cy="250" r="280" fill="url(#glow)"/>
  <circle cx="820" cy="250" r="180" fill="none" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="820" cy="250" r="220" fill="none" stroke="#00BCD4" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Floating currency symbols - right side decorative -->
  <text x="720" y="160" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="72" fill="#00BCD4" fill-opacity="0.12" font-weight="700">€</text>
  <text x="820" y="200" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="56" fill="#4DB6AC" fill-opacity="0.15" font-weight="700">£</text>
  <text x="890" y="310" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="64" fill="#00BCD4" fill-opacity="0.10" font-weight="700">¥</text>
  <text x="740" y="360" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="48" fill="#80DEEA" fill-opacity="0.12" font-weight="700">$</text>
  <text x="950" y="175" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="40" fill="#00BCD4" fill-opacity="0.10" font-weight="700">₹</text>

  <!-- App icon background pill -->
  <rect x="72" y="168" width="96" height="96" rx="22" fill="#00BCD4"/>
  <!-- Calculator grid icon inside pill -->
  <rect x="90" y="186" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="112" y="186" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="134" y="186" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="90" y="208" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="112" y="208" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="134" y="208" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="90" y="230" width="16" height="36" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="112" y="230" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="134" y="230" width="16" height="16" rx="3" fill="#ffffff" fill-opacity="0.9"/>

  <!-- App name -->
  <text x="185" y="226" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-2">TripCalc</text>

  <!-- Tagline -->
  <text x="185" y="268" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#80DEEA" letter-spacing="0.5">Your travel companion for money and more</text>

  <!-- Divider -->
  <line x1="72" y1="308" x2="630" y2="308" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="72" y="330" width="168" height="36" rx="18" fill="#00BCD4" fill-opacity="0.15" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="156" y="353" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#80DEEA" text-anchor="middle" font-weight="500">161 currencies</text>

  <!-- Pill 2 -->
  <rect x="252" y="330" width="152" height="36" rx="18" fill="#00BCD4" fill-opacity="0.15" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="328" y="353" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#80DEEA" text-anchor="middle" font-weight="500">Card fee profiles</text>

  <!-- Pill 3 -->
  <rect x="416" y="330" width="136" height="36" rx="18" fill="#00BCD4" fill-opacity="0.15" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="484" y="353" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#80DEEA" text-anchor="middle" font-weight="500">Tip &amp; fuel tools</text>

  <!-- Pill 4 -->
  <rect x="72" y="378" width="152" height="36" rx="18" fill="#00BCD4" fill-opacity="0.15" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="148" y="401" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#80DEEA" text-anchor="middle" font-weight="500">Size converter</text>

  <!-- Pill 5 -->
  <rect x="236" y="378" width="188" height="36" rx="18" fill="#00BCD4" fill-opacity="0.15" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.4"/>
  <text x="330" y="401" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#80DEEA" text-anchor="middle" font-weight="500">No ads · No tracking</text>

</svg>
